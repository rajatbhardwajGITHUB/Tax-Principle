spring.application.name=Usermangement
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/tax_principle_uat}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-expiration-ms=${APP_JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${APP_JWT_REFRESH_EXPIRATION_MS:604800000}
app.otp.expiration-minutes=${APP_OTP_EXPIRATION_MINUTES:10}
app.otp.return-in-response=${APP_OTP_RETURN_IN_RESPONSE:true}
# app.mail.enabled=false
# app.mail.from=no-reply@example.com
# spring.mail.host=smtp.example.com
# spring.mail.port=587
# spring.mail.username=your-smtp-username
# spring.mail.password=your-smtp-password
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.enabled=${APP_MAIL_ENABLED:true}
app.mail.from=${APP_MAIL_FROM:no-reply@example.com}
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.debug=${SPRING_MAIL_DEBUG:false}
